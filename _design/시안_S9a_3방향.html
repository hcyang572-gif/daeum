/* 쇼케이스: 질감 있는 깊은 바탕 위에 안 이름(큰 글자) → 기기 목업 3대(폰) 또는 노트북 1대(PC) → 아래 떠 있는 조작 캡슐 하나.
   화면 재질은 우리가족 매니저 «오로라 v5 플러스» 명세(FAMILY-TALK/design_mockups/v5_a_aurora_plus.html :13-112, :296-340, :1059-1135)와
   aurora_material.dart(윗변 1px 하이라이트·안쪽 그늘·노이즈 160px 타일·에나멜 단추)를 웹으로 옮겼다. */
:root {
  --pg-a: #EEECF5; --pg-b: #E3E0EE; --pg-ink: #17152A; --pg-sub: #5B5772; --pg-hair: rgba(23,21,42,.10);
  --pg-cap: rgba(252,251,255,.72); --pg-cap-brd: rgba(255,255,255,.9); --pg-cap-sh: 0 0 0 .5px rgba(23,21,42,.10), 0 2px 6px -2px rgba(40,30,90,.12), 0 24px 48px -20px rgba(40,30,90,.35);
  --pg-on: #FFFFFF; --pg-on-ink: #17152A; --pg-acc: #4E3FB5;
  --f: "Pretendard Dl", "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  --num: "Manrope", "Pretendard Dl", "Malgun Gothic", sans-serif;
  --c-std: cubic-bezier(.33,1,.68,1); --c-push: cubic-bezier(.32,.72,0,1); --c-spring: cubic-bezier(.34,1.12,.64,1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --pg-a: #0B0A13; --pg-b: #07060D; --pg-ink: #EEEDF6; --pg-sub: #A3A0B8; --pg-hair: rgba(255,255,255,.10);
  --pg-cap: rgba(28,26,44,.66); --pg-cap-brd: rgba(255,255,255,.10); --pg-cap-sh: 0 0 0 .5px rgba(255,255,255,.08), 0 24px 48px -16px rgba(0,0,0,.8);
  --pg-on: #EEEDF6; --pg-on-ink: #17152A; --pg-acc: #B4ABF2; color-scheme: dark; } }
:root[data-theme="dark"] {
  --pg-a: #0B0A13; --pg-b: #07060D; --pg-ink: #EEEDF6; --pg-sub: #A3A0B8; --pg-hair: rgba(255,255,255,.10);
  --pg-cap: rgba(28,26,44,.66); --pg-cap-brd: rgba(255,255,255,.10); --pg-cap-sh: 0 0 0 .5px rgba(255,255,255,.08), 0 24px 48px -16px rgba(0,0,0,.8);
  --pg-on: #EEEDF6; --pg-on-ink: #17152A; --pg-acc: #B4ABF2; color-scheme: dark; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: linear-gradient(180deg, var(--pg-a), var(--pg-b)) fixed; color: var(--pg-ink); font-family: var(--f);
  word-break: keep-all; overflow-wrap: break-word; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2.5px solid var(--pg-acc); outline-offset: 3px; border-radius: 10px; }
h1, h2, h3, p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* 바탕: 페이지용 실크 + 노이즈. 실크 그림은 스크립트가 만든다(명세 silk() 방식) */
.backdrop { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.backdrop .silk { position: absolute; inset: -10% -10% auto; height: 90vh; background-image: var(--pg-silk); background-size: cover; background-position: center;
  opacity: .9; -webkit-mask-image: linear-gradient(180deg, #000 30%, transparent); mask-image: linear-gradient(180deg, #000 30%, transparent);
  transition: background-image .6s; }
.backdrop .nz { position: absolute; inset: 0; background-image: var(--pg-nz); background-size: 160px 160px; opacity: .9; }

.wrap { max-width: 1400px; margin: 0 auto; padding-block: clamp(2.5rem, 6vw, 5rem) 9rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; justify-content: center; gap: .625rem; font-size: .9375rem; font-weight: 600; color: var(--pg-sub); letter-spacing: -.01em; }
.brand i { width: 1.375rem; height: 1.375rem; border-radius: 50%; background: radial-gradient(60% 60% at 35% 30%, #fff, transparent 60%), conic-gradient(from 200deg, #7465D6, #86A6D8, #B0617B, #7465D6);
  box-shadow: inset 0 0 0 .5px rgba(0,0,0,.15), 0 2px 8px -2px rgba(90,74,194,.6); }
.hero { text-align: center; margin: clamp(1.5rem, 4vw, 2.75rem) auto clamp(2rem, 5vw, 3.5rem); max-width: 56rem; display: grid; gap: 1rem; }
.hero .k { font-family: var(--num); font-size: .875rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--pg-acc); }
.hero h1 { font-size: clamp(3.5rem, 11vw, 8rem); font-weight: 800; letter-spacing: -.06em; line-height: .95; text-wrap: balance;
  background: linear-gradient(180deg, var(--pg-ink) 30%, color-mix(in srgb, var(--pg-ink) 55%, var(--pg-acc))); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: .06em; }
.hero p { font-size: clamp(1.125rem, 2.2vw, 1.5rem); line-height: 1.5; color: var(--pg-sub); font-weight: 500; letter-spacing: -.02em; text-wrap: balance; max-width: 36rem; margin-inline: auto; }
.hero p b { color: var(--pg-ink); font-weight: 700; }
.hero.swap h1, .hero.swap p, .hero.swap .k { animation: heroIn .8s var(--c-push) both; }
.hero.swap p { animation-delay: .08s; }
@keyframes heroIn { from { transform: translateY(18px); opacity: .25; filter: blur(6px); } }

/* 무대 */
.stage { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(1.5rem, 3vw, 3rem) clamp(1rem, 2.4vw, 2.5rem); perspective: 2200px; }
.shot { margin: 0; display: grid; justify-items: center; gap: 1.125rem; min-width: 0; }
.shot figcaption { display: grid; gap: .125rem; text-align: center; }
.shot figcaption b { font-size: 1rem; font-weight: 700; letter-spacing: -.02em; }
.shot figcaption span { font-size: .875rem; color: var(--pg-sub); }
.fit { position: relative; }
.fit > .dev { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.tilt { transform: scale(var(--k,1)) perspective(1800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)); transition: transform .9s var(--c-std); }
.tilt.live { transition: transform .18s linear; }

/* 폰 목업: 얇은 티타늄 테 + 다이내믹 아일랜드 */
.phone { width: 414px; height: 868px; padding: 12px; border-radius: 64px; position: relative;
  background: linear-gradient(140deg, #5C5B66 0%, #1F1E26 18%, #0D0C12 50%, #2B2A33 82%, #6A6974 100%);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), inset 0 0 0 3px #08070C, 0 0 0 .5px rgba(0,0,0,.6),
    0 2px 4px rgba(10,8,30,.18), 0 18px 36px -12px rgba(30,20,80,.35), 0 60px 90px -40px rgba(30,20,80,.55); }
.phone::before, .phone::after { content: ""; position: absolute; width: 3px; border-radius: 2px; background: linear-gradient(90deg, #2A2930, #67666F); }
.phone::before { left: -2px; top: 190px; height: 64px; box-shadow: 0 84px 0 #3A3942; }
.phone::after { right: -2px; top: 230px; height: 96px; }
.phone .scr { border-radius: 52px; }
.island { position: absolute; top: 23px; left: 50%; width: 118px; height: 34px; margin-left: -59px; border-radius: 20px; background: #000; z-index: 60; }
.island::after { content: ""; position: absolute; right: 13px; top: 11px; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #2B2E4A, #050508 65%); }

/* 노트북 목업 */
.laptop { width: 1340px; position: relative; }
.laptop .lid { padding: 18px 18px 22px; border-radius: 26px 26px 10px 10px; background: #08080C;
  box-shadow: inset 0 0 0 1.5px #3B3A43, inset 0 0 0 3px #0A0A0E, 0 30px 80px -30px rgba(20,14,60,.55), 0 4px 12px rgba(10,8,30,.2); }
.laptop .lid::before { content: ""; position: absolute; top: 7px; left: 50%; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: #1C1C24; }
.laptop .scr { border-radius: 6px; }
.laptop .base { height: 22px; margin: 0 -64px; border-radius: 2px 2px 26px 26px; position: relative;
  background: linear-gradient(180deg, #E6E6EC 0%, #C9C9D2 45%, #8F8F99 100%); box-shadow: inset 0 1px 0 #fff, 0 20px 30px -14px rgba(20,14,60,.5); }
.laptop .base::before { content: ""; position: absolute; left: 50%; top: 0; width: 180px; margin-left: -90px; height: 9px; border-radius: 0 0 12px 12px; background: linear-gradient(180deg, #B4B4BE, #D6D6DE); }

/* 조작 캡슐 하나 */
.dockbar { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50;
  display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: 999px; max-width: calc(100vw - 24px);
  background: var(--pg-cap); -webkit-backdrop-filter: blur(22px) saturate(1.7); backdrop-filter: blur(22px) saturate(1.7);
  box-shadow: inset 0 1px 0 var(--pg-cap-brd), var(--pg-cap-sh); }
.grp { display: flex; position: relative; }
.grp + .grp::before { content: ""; width: 1px; align-self: stretch; margin: 8px 4px; background: var(--pg-hair); }
.dockbar button { position: relative; height: 40px; min-width: 40px; padding: 0 14px; border-radius: 999px; font-size: .875rem; font-weight: 600; color: var(--pg-sub); letter-spacing: -.01em;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: color .2s var(--c-std), background .3s var(--c-std), transform .2s var(--c-spring); white-space: nowrap; }
.dockbar button:active { transform: scale(.95); }
.dockbar button[aria-pressed="true"] { color: var(--pg-on-ink); background: linear-gradient(180deg, #fff, #F3F1FA);
  box-shadow: inset 0 1px 0 #fff, 0 0 0 .5px rgba(23,21,42,.12), 1px 3px 8px -3px rgba(60,40,140,.35); }
.dockbar button b { font-family: var(--num); font-weight: 800; }
.dockbar svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 560px) { .dockbar .nm { display: none; } .dockbar button { padding: 0 11px; } }

.foot { margin-top: 4rem; text-align: center; color: var(--pg-sub); font-size: .875rem; line-height: 1.7; }
.notes { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem 1.75rem; max-width: 60rem; margin: 3rem auto 0; color: var(--pg-sub); font-size: .9375rem; }
.notes span b { color: var(--pg-ink); font-weight: 700; margin-right: .375rem; }

/* ══════════ 화면(재질) ══════════ */
.scr { width: 390px; height: 844px; position: relative; overflow: hidden; isolation: isolate;
  background-image: var(--nz), linear-gradient(180deg, var(--pa), var(--pb)); background-size: 160px 160px, auto;
  color: var(--ink); font-family: var(--f); font-size: 17px; line-height: 1.55; letter-spacing: -.012em; }
.scr.pc { width: 1280px; height: 800px; font-size: 16px; }
.scr * { box-sizing: border-box; }
.scr svg.i { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

.scr[data-dir="a"] { --pa:#F8F7FC; --pb:#F1EFF8; --s1a:#FFFFFF; --s1b:#FCFBFF; --ink:#1B1830; --ink2:#5E5A73; --ink3:#8D89A1; --hair:rgba(23,21,40,.07);

  --glass:rgba(15,14,24,.78); --glass-hl:rgba(255,255,255,.08); --glass-brd:rgba(255,255,255,.06); --nz:var(--nz-d); --nzc:var(--nzc-d); }

.scr[data-dir="b"] { --pa:#F6F3F8; --pb:#EEEAF3; --s1a:#FFFFFF; --s1b:#FBF9FD; --ink:#1A1730; --ink2:#5A566E; --ink3:#8B87A0; --hair:rgba(23,21,40,.07);

  --hl:inset 0 1px 0 rgba(255,255,255,.95); --hlb:inset 0 -1px 0 rgba(23,21,40,.04);
  --e1:0 0 0 .5px rgba(27,24,48,.05),1px 1px 2px rgba(40,40,100,.06);
  --e2:0 0 0 .5px rgba(27,24,48,.05),1px 2px 5px -1px rgba(40,40,100,.07),6px 22px 44px -20px rgba(50,60,150,.24);

  --well:linear-gradient(180deg,#ECEAF2,#F2F0F7); --well-sh:inset 0 1px 2px rgba(40,40,100,.08),inset 0 0 0 .5px rgba(23,21,40,.05),0 1px 0 rgba(255,255,255,.85);
  --glass:rgba(255,255,255,.62); --glass-hl:rgba(255,255,255,.98); --glass-brd:rgba(255,255,255,.5);
  --nz:var(--nz-l); --nzc:var(--nzc-l); --r:34px; --rb:999px; }
.scr[data-dir="b"][data-scheme="dark"] { --pa:#10101C; --pb:#0B0B14; --s1a:#1D1C2E; --s1b:#17162A; --ink:#EDECF5; --ink2:#A9A6BC; --ink3:#78758E; --hair:rgba(255,255,255,.07);
  --acc:#5578CC; --acc-hi:#7E9BE0; --acc-lo:#3A5AA6; --acc-ink:#A9BFF0; --acc-soft:#1E2740; --pos:#7CC4A6; --neg:#EC9A92; --neg-soft:#3A1F1E;
  --hl:inset 0 1px 0 rgba(255,255,255,.1); --hlb:inset 0 -1px 0 rgba(0,0,0,.25);
  --e1:0 0 0 .5px rgba(255,255,255,.05),1px 1px 2px rgba(4,3,14,.5);
  --e2:0 0 0 .5px rgba(255,255,255,.06),1px 2px 4px -1px rgba(4,3,14,.55),6px 22px 44px -18px rgba(4,3,14,.85);
  --e3:0 0 0 .5px rgba(255,255,255,.07),1px 4px 12px -4px rgba(4,3,14,.6),8px 34px 70px -24px rgba(4,3,14,.9);
  --well:linear-gradient(180deg,#141322,#1A192B); --well-sh:inset 0 1px 2px rgba(0,0,0,.45),inset 0 0 0 .5px rgba(255,255,255,.04),0 1px 0 rgba(255,255,255,.03);
  --glass:rgba(24,23,38,.6); --glass-hl:rgba(255,255,255,.1); --glass-brd:rgba(255,255,255,.07); --nz:var(--nz-d); --nzc:var(--nzc-d); }

.scr[data-dir="c"] { --pa:#F4F4F8; --pb:#ECECF2; --s1a:rgba(255,255,255,.86); --s1b:rgba(250,250,253,.8); --ink:#15141F; --ink2:#575566; --ink3:#8A8899; --hair:rgba(21,20,31,.08);
  --acc:#5B4FD0; --acc-hi:#7B70E2; --acc-lo:#4236A8; --acc-ink:#4B3FBE; --acc-soft:#ECEAFA; --on-acc:#fff; --pos:#2F7A5F; --neg:#B0413E; --neg-soft:#F8E9E8;
  --hl:inset 0 1px 0 rgba(255,255,255,.9); --hlb:inset 0 -1px 0 rgba(21,20,31,.05);
  --e1:0 0 0 .5px rgba(21,20,31,.08),0 1px 2px rgba(21,20,31,.06);
  --e2:0 0 0 .5px rgba(21,20,31,.08),0 2px 4px -1px rgba(21,20,31,.06),0 16px 36px -18px rgba(40,30,110,.25);
  --e3:0 0 0 .5px rgba(21,20,31,.09),0 4px 10px -4px rgba(21,20,31,.1),0 28px 60px -24px rgba(40,30,110,.35);
  --well:linear-gradient(180deg,#E8E8EF,#EFEFF4); --well-sh:inset 0 1px 2px rgba(21,20,31,.08),inset 0 0 0 .5px rgba(21,20,31,.06),0 1px 0 rgba(255,255,255,.8);
  --glass:rgba(255,255,255,.66); --glass-hl:rgba(255,255,255,.95); --glass-brd:rgba(21,20,31,.07);
  --nz:var(--nz-l); --nzc:var(--nzc-l); --r:22px; --rb:14px; }

  --acc:#6C5FE0; --acc-hi:#9186F0; --acc-lo:#4E42BE; --acc-ink:#B6AEF7; --acc-soft:rgba(124,110,240,.16); --pos:#7FD3AE; --neg:#F2A097; --neg-soft:rgba(242,120,110,.14);
  --hl:inset 0 1px 0 rgba(255,255,255,.12); --hlb:inset 0 -1px 0 rgba(0,0,0,.3);
  --e1:0 0 0 .5px rgba(255,255,255,.07),0 1px 2px rgba(0,0,0,.5);
  --e2:0 0 0 .5px rgba(255,255,255,.08),0 2px 6px -2px rgba(0,0,0,.6),0 24px 48px -20px rgba(0,0,0,.9);
  --e3:0 0 0 .5px rgba(255,255,255,.1),0 4px 12px -4px rgba(0,0,0,.6),0 36px 70px -26px rgba(0,0,0,.95);
  --well:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.22)); --well-sh:inset 0 1px 2px rgba(0,0,0,.5),inset 0 0 0 .5px rgba(255,255,255,.06),0 1px 0 rgba(255,255,255,.04);
  --glass:rgba(26,25,42,.55); --glass-hl:rgba(255,255,255,.12); --glass-brd:rgba(255,255,255,.08); --nz:var(--nz-d); --nzc:var(--nzc-d); }

.scr { --map-bg: color-mix(in srgb, var(--pb) 70%, var(--acc-soft)); --river: color-mix(in srgb, #86A6D8 55%, transparent); --road: color-mix(in srgb, var(--ink) 7%, transparent);
  --enamel: radial-gradient(120% 90% at 18% 0%, rgba(255,255,255,.28), transparent 46%), linear-gradient(155deg, var(--acc-hi), var(--acc) 52%, var(--acc-lo));
  --enamel-sh: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -2px 4px rgba(20,20,80,.25), 0 0 0 .5px color-mix(in srgb, var(--acc-lo) 70%, transparent), 1px 3px 6px -2px color-mix(in srgb, var(--acc) 45%, transparent), 3px 14px 28px -12px color-mix(in srgb, var(--acc) 60%, transparent);
  --enamel-dn: inset 0 1px 0 rgba(255,255,255,.2), inset 0 1px 5px rgba(20,20,80,.42), 0 0 0 .5px color-mix(in srgb, var(--acc-lo) 70%, transparent), 0 1px 1px rgba(40,30,120,.3); }

/* 공통 부품 */
.layer { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
.layer::-webkit-scrollbar { display: none; }
.sbar { height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0 40px; font: 700 16px var(--num); letter-spacing: -.01em; position: relative; z-index: 5; }
.sbar svg { height: 13px; fill: currentColor; }
.card { position: relative; border-radius: var(--r); background-image: var(--nzc), linear-gradient(180deg, var(--s1a), var(--s1b)); background-size: 160px 160px, auto; box-shadow: var(--hl), var(--hlb), var(--e2); }
.scr[data-dir="c"] .card { -webkit-backdrop-filter: blur(20px) saturate(1.5); backdrop-filter: blur(20px) saturate(1.5); }
.glass { -webkit-backdrop-filter: blur(26px) saturate(1.7); backdrop-filter: blur(26px) saturate(1.7); background: var(--glass); box-shadow: inset 0 1px 0 var(--glass-hl), inset 0 0 0 .5px var(--glass-brd), var(--e3); }
.well { background: var(--well); box-shadow: var(--well-sh); }
.btn { display: flex; align-items: center; justify-content: center; gap: 10px; height: 60px; width: 100%; border-radius: var(--rb); font-size: 18px; font-weight: 700; letter-spacing: -.02em;
  transition: transform 280ms var(--c-spring), box-shadow 240ms var(--c-std); }
.btn-p { color: var(--on-acc); background: var(--enamel); box-shadow: var(--enamel-sh); }
.btn-p:active { transform: scale(.97); box-shadow: var(--enamel-dn); transition-duration: 70ms; }
.btn-s { color: var(--acc-ink); background-image: linear-gradient(180deg, var(--s1a), var(--s1b)); box-shadow: var(--hl), var(--e1); }
.btn-s:active { transform: scale(.97); }
.lift { transition: transform 320ms var(--c-spring), box-shadow 320ms var(--c-std); transform: translateZ(0); }
.lift:hover { transform: translateY(-3px); box-shadow: var(--hl), var(--hlb), var(--e3); }
.lift:active { transform: scale(.98); transition-duration: 100ms; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }
.lbl { font-size: 14px; font-weight: 600; color: var(--ink2); letter-spacing: -.005em; }
.tag { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--neg); background: var(--neg-soft); }
.tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.ring { width: 52px; height: 52px; position: relative; flex: none; display: grid; place-items: center; }
.ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 4; }
.ring .t { stroke: var(--hair); }
.ring .v { stroke: var(--acc); stroke-linecap: round; transition: stroke-dashoffset 1.1s var(--c-push); }
.ring.hot .v { stroke: var(--neg); }
.ring b { font: 700 17px var(--num); letter-spacing: -.03em; }

/* 오로라 구슬(말하기) */
.orb { position: relative; width: 132px; height: 132px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
.orb .g { position: absolute; inset: -26px; border-radius: 50%; background: conic-gradient(from 0deg, var(--acc-hi), #B0617B, #86A6D8, #7FB2AA, var(--acc-hi)); filter: blur(26px); opacity: .55; animation: spin 9s linear infinite; }
.orb .b { position: absolute; inset: 0; border-radius: 50%; background: var(--enamel); box-shadow: var(--enamel-sh); }
.orb .b::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(55% 40% at 32% 22%, rgba(255,255,255,.55), transparent 70%); }
.orb svg.i { position: relative; width: 44px; height: 44px; stroke-width: 1.6; }
.orb:active .b { box-shadow: var(--enamel-dn); }
.orb:active { transform: scale(.96); }
.orb { transition: transform 280ms var(--c-spring); }
@keyframes spin { to { transform: rotate(360deg); } }

/* 등장 */
.rise { animation: rise .72s var(--c-push) both; animation-delay: calc(var(--d, 0) * 55ms + 120ms); }
@keyframes rise { from { transform: translateY(16px) scale(.985); opacity: .3; } }

/* ── 국민 첫 화면 ── */
.c-home { padding: 0 22px 120px; display: flex; flex-direction: column; gap: 22px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
.logo i { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(60% 60% at 35% 30%, rgba(255,255,255,.9), transparent 60%), conic-gradient(from 200deg, var(--acc-hi), #86A6D8, #B0617B, var(--acc-hi)); box-shadow: inset 0 0 0 .5px rgba(0,0,0,.15); }
.logo span { color: var(--ink2); font-weight: 500; font-size: 15px; margin-left: auto; }
.h-big { font-size: 38px; font-weight: 800; letter-spacing: -.05em; line-height: 1.16; }
.h-big em { font-style: normal; color: var(--acc-ink); }

      return '<article class="card svc lift rise' + (i === 0 ? " first" : "") + '" style="--d:' + (3 + i) + '">' + bfit + '<div class="hd"><div><h3>' + s.n + '</h3><div class="org">' + s.o + "</div></div>" + viz + "</div>" +
        (dir === "a" ? '<div class="fitbar"><span>맞는 정도</span><span class="tr"><i style="width:' + s.f + '%"></i></span><b class="num" style="color:var(--acc-ink)">' + s.f + "</b></div>" : "") +
        '<p class="why">' + s.w + '</p><div class="meta">' + s.m.map(function (m) { return "<span>" + m[0] + " <b>" + m[1] + "</b></span>"; }).join("") + "</div></article>";
    }).join("");
    return (dir === "b" ? '<div class="silkhead" style="height:300px;opacity:.7"></div>' : dir === "c" ? '<div class="aura" style="top:-160px"></div>' : "") +
      '<div class="layer">' + SB + '<div class="c-res"><div class="nav rise"><button class="bk card" aria-label="뒤로">' + ic("left") + '</button><span class="ttl">찾은 도움</span></div>' +
      '<h2 class="h-big rise" style="--d:1;font-size:32px">받으실 수 있는<br>도움이 <em class="num">3</em>가지 있어요</h2>' +
      '<div class="card heard rise" style="--d:2"><span class="lbl">이렇게 알아들었어요</span><div class="who"><span>82세</span><span>혼자 사심</span><span>무릎 통증</span><span>병원 가기 어려움</span></div></div>' +
      cards + '</div></div><div class="cta"><button class="btn btn-p ask" data-h="heavy">' + ic("hand") + "담당 공무원에게 도움 요청</button></div>";
  }
  function oPhone(dir) {
    var rows = HH.slice(0, 4).map(function (h, i) {
      var why = h.why.map(function (w, j) { return j === 0 && h.hot ? '<span class="hot">' + w + "</span>" : w; }).join(" · ");
      if (dir === "c") return '<button class="hh lift" data-h="selection"><span class="ix num">0' + (i + 1) + '</span><span class="b"><strong>' + h.id + "</strong><span>" + why + '</span></span><span class="scc' + (h.hot ? " hot" : "") + '"><b class="num">' + h.s + '</b><i><u style="width:' + h.s + '%"></u></i></span></button>';
      if (dir === "b") return '<button class="hh card lift rise" style="--d:' + (2 + i) + '" data-h="selection">' + ring(h.s, h.hot) + '<span class="b"><strong>' + h.id + "</strong><span>" + why + "</span></span>" + ic("right") + "</button>";
      return '<button class="hh lift" data-h="selection">' + ring(h.s, h.hot) + '<span class="b"><strong>' + h.id + "</strong><span>" + why + "</span></span>" + ic("right") + "</button>";
    }).join("");
    var auto = dir === "c"
      ? '<div class="card auto tl rise" style="--d:1"><div class="cnum">밤사이 자동 처리 · 4단계</div>' + [["02:00", "위기 신호 1,284가구 확인"], ["02:40", "우선순위 6가구 선정"], ["03:10", "방문 경로 3곳 작성"], ["03:30", "상담 기록 초안 6건"]].map(function (a) { return '<div class="tr2"><span class="num">' + a[0] + '</span><i></i><span>' + a[1] + "</span></div>"; }).join("") + "</div>"
      : dir === "b"
      ? '<div class="card auto bauto rise" style="--d:1"><div class="h">' + ic("spark") + '밤사이 닿음이 끝낸 일</div><p>명단·경로·상담 기록<br><em class="num">18건</em>을 미리 해 두었어요</p></div>'
      : '<div class="card auto rise" style="--d:1"><div class="h">' + ic("spark") + '밤사이 닿음이 끝낸 일</div><ul>' + [["1,284", "가구 위기 신호 확인"], ["3", "건 방문 경로 작성"], ["6", "건 상담 기록 초안"]].map(function (a) { return '<li class="well"><b>' + a[0] + "</b><span>" + a[1] + "</span></li>"; }).join("") + "</ul></div>";
    return (dir === "c" ? '<div class="aura" style="top:-220px;opacity:.5"></div>' : dir === "b" ? '<div class="silkhead" style="height:320px;opacity:.75"></div>' : "") +
      '<div class="layer">' + SB + '<div class="o-ph"><div class="today rise"><div><div class="d">10월 30일 목요일 · 모서면 담당</div><h2>오늘 찾아갈 집</h2></div><div class="n num" data-count="6">6<small>가구</small></div></div>' +
      auto + (dir === "b" ? '<div class="blist">' + rows + "</div>" : '<div class="card list rise" style="--d:2">' + rows + "</div>") +
      '<div class="card route rise" style="--d:3"><div class="h"><b>추천 방문 순서</b><span class="num">62km · 1시간 20분</span></div><div class="map">' + mapSvg(dir) + "</div></div></div></div>" +
      '<nav class="tabbar glass">' + [["home", "오늘", 1], ["list", "명단"], ["route", "경로"], ["doc", "기록"]].map(function (t) { return '<button class="' + (t[2] ? "on" : "") + '" data-h="selection">' + ic(t[0]) + t[1] + "</button>"; }).join("") + "</nav>";
  }
  function oPC(dir) {
    var trs = HH.map(function (h, i) {
      return '<tr class="' + (i === 0 ? "sel" : "") + '" data-i="' + i + '"><td class="rk">' + (i + 1) + '</td><td class="hn">' + h.id.split(" · ")[1] + "<small>" + h.id.split(" · ")[0] + "</small></td><td>" +
        h.why.map(function (w, j) { return j === 0 && h.hot ? '<span class="tag">' + w + "</span>" : '<span style="color:var(--ink2)">' + w + "</span>"; }).join('<span style="color:var(--ink3)"> · </span>') +
        '</td><td class="sc"><div class="sbar2"><span class="tr"><i class="' + (h.hot ? "hot" : "") + '" style="width:' + h.s + '%;animation-delay:' + (200 + i * 60) + 'ms"></i></span><b>' + h.s + "</b></div></td></tr>";
    }).join("");
    return (dir === "c" ? '<div class="grid-bg"></div><div class="aura" style="left:62%;top:-240px;width:760px;height:760px;opacity:.45"></div>' : dir === "b" ? '<div class="pc-silk"></div>' : "") +
      '<div class="pc-g"><aside class="rail glass"><div class="logo"><i></i>닿음</div>' +
      [["home", "오늘", "6", 1], ["list", "위기가구 명단", "1,284"], ["route", "방문 경로"], ["doc", "상담 기록", "6"], ["chart", "효과 보기"], ["gear", "점수 기준"]].map(function (a) { return '<a class="' + (a[3] ? "on" : "") + '">' + ic(a[0]) + a[1] + (a[2] ? "<em>" + a[2] + "</em>" : "") + "</a>"; }).join("") +
      '<div class="me"><i></i><div><b>김주무관</b>모서면 맞춤형복지팀</div></div></aside>' +
      '<section class="main"><div class="mh rise"><div><h2>오늘 찾아갈 집 6곳</h2><p>10월 30일 목요일 · 밤사이 1,284가구를 살펴 순서를 정했어요</p></div><button class="btn btn-p" data-h="medium">' + ic("route") + "경로대로 출발</button></div>" +
      '<div class="kpis">' + [["직접 확인할 가구", "6", "가구", "1,284가구 중 위기 신호 순"], ["자동으로 끝낸 서류", "18", "건", "명단·경로·기록 초안"], ["오늘 아낀 시간(예시)", "2.7", "시간", "수작업 대비 추정"]].map(function (k, i) {
        return '<div class="card kpi lift rise" style="--d:' + (1 + i) + '"><span>' + k[0] + '</span><b class="num">' + k[1] + "<small>" + k[2] + "</small></b><em>" + k[3] + "</em></div>"; }).join("") + "</div>" +
      '<div class="card tbl rise" style="--d:4"><table><thead><tr><th>순서</th><th>가구</th><th>왜 이 집인지</th><th>위기 점수</th></tr></thead><tbody>' + trs + "</tbody></table></div></section>" +
      '<aside class="side" id="det"></aside></div>';
  }
  function detail(i) {
    var h = HH[i];
    return '<div class="card det rise"><div class="top"><div><p>' + h.id.split(" · ")[0] + "</p><h3>" + h.id.split(" · ")[1] + '</h3></div><div class="big"><b class="num" style="' + (h.hot ? "" : "color:var(--acc-ink)") + '">' + h.s + "</b><small>위기 점수</small></div></div>" +
      '<div class="brk">' + h.brk.map(function (b) { return "<div><span>" + b[0] + '</span><span class="sbar2"><span class="tr"><i style="width:' + Math.round(b[1] / 36 * 100) + '%"></i></span></span><b>+' + b[1] + "</b></div>"; }).join("") + "</div></div>" +
      '<div class="card route rise" style="--d:1;padding:14px"><div class="h"><b>방문 경로</b><span class="num">' + (i + 1) + "번째 · 62km</span></div><div class=\"map\" style=\"height:120px\">" + mapSvg() + "</div></div>" +
      '<div class="card summ rise" style="--d:2"><div class="h">' + ic("doc") + "상담 기록 초안<em>자동 작성</em></div><p>" + h.sum + '</p><div class="acts"><button class="btn btn-p" data-h="success">확인하고 저장</button><button class="btn btn-s" data-h="light">고치기</button></div></div>';
  }

  /* ── 안 정보 ── */
  var DIR = {
    a: { k: "A안 · 세라믹", n: "세라믹", l: "우리가족의 하얀 도자기 면에 <b>보라 하나</b>. 말수를 줄이고 큰 글자와 여백으로 위계를 세웠습니다.", s: "light", notes: [["재질", "흰 세라믹 면 · 윗변 1px 빛 · 보라 기운 그림자 3단"], ["글자", "프리텐다드 800 큰 제목 · 숫자는 Manrope 가는 굵기"], ["참고", "Linear · Apple 설정 앱의 절제"]] },
    b: { k: "B안 · 실크", n: "실크", l: "새벽 하늘 같은 <b>비단 바탕</b> 위로 반투명 판이 떠오릅니다. 어르신이 먼저 손을 뻗는 크고 둥근 화면.", s: "light", notes: [["재질", "흐린 실크 그림 · 반투명 유리 판 · 알약 단추"], ["글자", "40px 인사말 · 맞는 정도를 큰 숫자로"], ["참고", "Toss · Airbnb의 따뜻한 큰 글씨"]] },
    c: { k: "C안 · 관제", n: "관제", l: "밤의 유리 위에 <b>데이터가 떠 있습니다</b>. 공무원의 하루를 한 화면에 쥐는 정밀한 대시보드.", s: "dark", notes: [["재질", "어두운 유리 · 오로라 빛 번짐 · 미세 격자"], ["글자", "가는 숫자 · 대문자 표 머리 · 점수 고리"], ["참고", "Stripe · visionOS 위젯의 깊이"]] }
  };
  var st = { dir: "a", view: "phone", scheme: null };
  var stage = document.getElementById("stage");

  function devPhone(html, dir, cls, cap, sub) {
    return '<figure class="shot"><div class="fit"><div class="dev tilt"><div class="phone"><div class="island"></div><div class="scr ' + cls + '" data-dir="' + dir + '" data-scheme="' + scheme() + '">' + html + '</div></div></div></div><figcaption><b>' + cap + "</b><span>" + sub + "</span></figcaption></figure>";
  }
  function scheme() { return st.scheme || DIR[st.dir].s; }
  function render(anim) {
    var d = st.dir, s = scheme(), v = DIR[d];
    var hero = document.getElementById("hero");
    document.getElementById("hk").textContent = v.k; document.getElementById("hn").textContent = v.n; document.getElementById("hl").innerHTML = v.l;
    if (anim) { hero.classList.remove("swap"); void hero.offsetWidth; hero.classList.add("swap"); }
    document.getElementById("notes").innerHTML = v.notes.map(function (n) { return "<span><b>" + n[0] + "</b>" + n[1] + "</span>"; }).join("");
    var pgDark = matchMedia("(prefers-color-scheme: dark)").matches && R.dataset.theme !== "light" || R.dataset.theme === "dark";
    setv("--pg-silk", d === "c" ? (pgDark ? T.pgC : T.pgCL) : d === "b" ? (pgDark ? T.pgBD : T.pgB) : (pgDark ? T.pgD : T.pgL));
    setv("--silk-b", s === "dark" ? T.bD : T.bL);
    setv("--pg-nz", pgDark ? "var(--nz-d)" : "var(--nz-l)");
    if (st.view === "phone") {
      stage.innerHTML = devPhone(cHome(d), d, "s-home", "국민 · 첫 화면", "말이나 글로 사정을 알려요") + devPhone(cRes(d), d, "s-res", "국민 · 찾은 도움", "AI가 고른 제도와 이유") + devPhone(oPhone(d), d, "s-off", "공무원 · 오늘 명단", "현장에서 폰으로 확인");
    } else {
      stage.innerHTML = '<figure class="shot" style="width:100%"><div class="fit"><div class="dev tilt"><div class="laptop"><div class="lid"><div class="scr pc" data-dir="' + d + '" data-scheme="' + s + '">' + oPC(d) + '</div></div><div class="base"></div></div></div></div><figcaption><b>공무원 · 업무 화면(PC)</b><span>명단·근거·경로·상담 기록 초안이 한 화면에 — 줄을 누르면 오른쪽이 바뀝니다</span></figcaption></figure>';
      document.getElementById("det").innerHTML = detail(0);
    }
    fit(); wire();
    requestAnimationFrame(function () { requestAnimationFrame(function () { stage.querySelectorAll(".ring .v").forEach(function (c) { c.style.strokeDashoffset = c.dataset.off; }); }); });
    syncBtns();
  }
  function fit() {
    var W = stage.clientWidth, figs = stage.querySelectorAll(".fit");
    if (st.view === "phone") {
      var n = W >= 1180 ? 3 : W >= 800 ? 2 : 1, gap = n > 1 ? Math.min(40, W * .024) : 0;
      var k = Math.min(1, (W - gap * (n - 1)) / n / 414);
      figs.forEach(function (f) { f.style.width = 414 * k + "px"; f.style.height = 868 * k + "px"; f.firstChild.style.setProperty("--k", k); });
    } else {
      var w = 1340 + 128, k2 = Math.min(1, W / w), h = (836 + 22);
      figs.forEach(function (f) { f.style.width = 1340 * k2 + "px"; f.style.height = h * k2 + "px"; f.style.marginInline = (64 * k2) + "px"; f.firstChild.style.setProperty("--k", k2); });
    }
  }
  function syncBtns() {
    document.querySelectorAll(".dockbar [data-dir]").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.dir === st.dir); });
    document.querySelectorAll(".dockbar [data-view]").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.view === st.view); });
    document.querySelectorAll(".dockbar [data-scheme]").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.scheme === scheme()); });
  }
  /* 기기 기울기(은은하게) */
  function wire() {
    stage.querySelectorAll(".tilt").forEach(function (t) {
      if (reduce.matches) return;
      var host = t.parentNode;
      host.addEventListener("pointermove", function (e) { if (e.pointerType !== "mouse") return; var r = host.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
        t.classList.add("live"); t.style.setProperty("--ry", (x * (st.view === "pc" ? 3 : 7)).toFixed(2) + "deg"); t.style.setProperty("--rx", (-y * (st.view === "pc" ? 2 : 5)).toFixed(2) + "deg"); });
      host.addEventListener("pointerleave", function () { t.classList.remove("live"); t.style.setProperty("--ry", "0deg"); t.style.setProperty("--rx", "0deg"); });
    });
    stage.querySelectorAll("[data-h]").forEach(function (b) { b.addEventListener("click", function () { hap(b.dataset.h); }); });
    var go = stage.querySelector(".s-home .go");
    if (go) go.addEventListener("click", function () { searching(go.closest(".scr")); });
    var ask = stage.querySelector(".s-res .ask");
    if (ask) ask.addEventListener("click", function () { done(ask.closest(".scr")); });
    stage.querySelectorAll(".tbl tbody tr").forEach(function (tr) { tr.addEventListener("click", function () {
      hap("selection"); stage.querySelectorAll(".tbl tr.sel").forEach(function (x) { x.classList.remove("sel"); }); tr.classList.add("sel");
      document.getElementById("det").innerHTML = detail(+tr.dataset.i); }); });
  }
  function searching(scr) {
    var o = document.createElement("div"); o.className = "over";
    o.innerHTML = '<span class="orb"><span class="g"></span><span class="b"></span>' + ic("spark") + '</span><h3>도움을 찾고 있어요</h3><div class="steps"><div class="on"><i></i>말씀을 알아들었어요</div><div><i></i>받을 수 있는 제도 살피기</div><div><i></i>상주시 제도와 맞추기</div></div>';
    scr.appendChild(o);
    var ds = o.querySelectorAll(".steps div");
    setTimeout(function () { ds[1].classList.add("on"); hap("selection"); }, 700);
    setTimeout(function () { ds[2].classList.add("on"); hap("selection"); }, 1400);
    setTimeout(function () { scr.innerHTML = cRes(st.dir); hap("success"); requestAnimationFrame(function () { requestAnimationFrame(function () { scr.querySelectorAll(".ring .v").forEach(function (c) { c.style.strokeDashoffset = c.dataset.off; }); }); });
      var a = scr.querySelector(".ask"); a.addEventListener("click", function () { hap("heavy"); done(scr); }); }, 2100);
  }
  function done(scr) {
    var o = document.createElement("div"); o.className = "over";
    o.innerHTML = '<svg class="check" viewBox="0 0 96 96"><circle cx="48" cy="48" r="44"/><path d="M30 49l12 12 24-26"/></svg><h3>요청을 보냈어요</h3><p class="sub">모서면 행정복지센터 담당 공무원이<br>3일 안에 전화드려요.</p><button class="btn btn-s" style="max-width:240px">처음으로</button>';
    scr.appendChild(o); hap("success");
    o.querySelector("button").addEventListener("click", function () { o.remove(); hap("light"); });
  }

  document.querySelectorAll(".dockbar button").forEach(function (b) {
    b.addEventListener("click", function () {
      hap("selection");
      if (b.dataset.dir) { if (st.dir === b.dataset.dir) return; st.dir = b.dataset.dir; st.scheme = null; try { history.replaceState(null, "", "#" + st.dir); } catch (e) {} render(true); }
      else if (b.dataset.view) { st.view = b.dataset.view; render(false); }
      else if (b.dataset.scheme) { st.scheme = b.dataset.scheme; render(false); }
      else if (b.id === "replay") render(true);
    });
  });
  function fromHash() { var h = (location.hash || "").replace("#", ""); var m = /^([abc])(-pc)?$/.exec(h); if (m) { st.dir = m[1]; st.view = m[2] ? "pc" : "phone"; } }
  fromHash();
  window.addEventListener("hashchange", function () { fromHash(); render(true); });
  var rt; window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(fit, 80); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () { render(false); });
  document.fonts && document.fonts.ready.then(fit);
  render(true);
})();
</script>
