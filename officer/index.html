<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 84회차 S12-x ⑤(⚙️ 파로): 옛 공무원 화면(흐름 ①~⑨, flow.js)은 내렸다. 이 주소로 들어온 분을 지금 앱(/daeum/)으로 안내하는 한 장. 앱 주소는 그대로. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://*.naver.com https://*.naver.net https://*.pstatic.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com https://*.naver.com https://*.naver.net https://*.pstatic.net; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob: https://*.naver.com https://*.naver.net https://*.pstatic.net; connect-src 'self' https://gicjzrxgktpovnphtjhi.supabase.co wss://gicjzrxgktpovnphtjhi.supabase.co https://*.naver.com https://*.naver.net https://*.pstatic.net https://*.navercorp.com; worker-src 'self'; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<link rel="manifest" href="../manifest.webmanifest?v=s12z86">
<link rel="icon" href="../shared/icons/daeum.svg?v=s12z86" type="image/svg+xml">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ECEAE5">
<title>복지 사각지대 현장 업무 도우미 — 닿음</title>
<meta name="description" content="복지 사각지대 현장 업무 도우미(닿음) — 지금 화면으로 가는 안내">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --bg: #ECEAE5; --card: #FBFAF7; --ink: #1F2A30; --sub: #5A6770; --pr: #1F5F57; --line: rgba(31, 42, 48, .12); }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Pretendard Variable", "Pretendard", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; }
  .card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 28px 24px; box-shadow: 0 12px 32px rgba(31, 42, 48, .08); text-align: center; }
  .k { font-size: 13px; color: var(--sub); letter-spacing: .02em; }
  h1 { font-size: 22px; margin: 6px 0 10px; }
  p { font-size: 15px; line-height: 1.6; color: var(--sub); margin: 0 0 22px; }
  a.go { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 22px; border-radius: 12px; background: var(--pr); color: #fff; font-weight: 700; font-size: 16px; text-decoration: none; }
  a.go:focus-visible { outline: 3px solid #E0A03A; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <section class="card" aria-labelledby="t">
    <span class="k">복지 사각지대 현장 업무 도우미</span>
    <h1 id="t">닿음</h1>
    <p>이 주소는 예전 화면입니다.<br>지금 화면에서 같은 일을 모두 할 수 있습니다.</p>
    <a class="go" id="go" href="../">지금 화면으로 가기</a>
  </section>
</main>
<script>
  // 옛 사용 방법 링크(#s1~#s9)로 들어오면 새 화면의 «사용 방법»으로
  (function () { var h = location.hash || ""; if (/^#s[1-9]$/.test(h)) document.getElementById("go").href = "../#help"; })();
</script>
</body>
</html>
