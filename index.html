<script>
(function () {

  var P = DBOOT_PLAN.split(",").map(Number), N = P[2], el = document.getElementById("dboot");
  if (!el) return;

  var path = $("dbPath"), pin = $("dbPin"), pctEl = $("dbPct"), nowEl = $("dbNow"), leftEl = $("dbLeft"), steps = el.querySelectorAll(".db-steps li");

    el.setAttribute("aria-valuenow", Math.floor(p));
    path.setAttribute("stroke-dasharray", p.toFixed(2) + " 100");
    if (len) { var pt = path.getPointAtLength(len * p / 100); pin.setAttribute("transform", "translate(" + pt.x.toFixed(1) + " " + pt.y.toFixed(1) + ")"); }
    for (i = 0; i < 4; i++) {
      var f = i < 3 ? Math.max(0, Math.min(1, (k - b[i]) / (b[i + 1] - b[i]))) : (finished ? 1 : k >= N ? ((font ? .5 : 0) + (sync || !needSync ? .5 : 0)) * .9 : 0);
      steps[i].style.setProperty("--f", f.toFixed(3));
      steps[i].className = f >= 1 ? "ok" : (i === s ? "on" : "");
    }
    var now = finished ? "준비 끝" : s < 3 ? NOW[s] : (needSync && !sync ? "연동 확인하는 중" : "첫 화면 그리는 중");
    if (now !== lastNow && !el.classList.contains("err")) { nowEl.textContent = now; lastNow = now; }
    leftEl.textContent = finished ? "곧 열립니다" : k < N ? "남은 자료 " + (N - k) + "개" : "거의 다 왔습니다";
  }

    if (el.classList.contains("reach")) return;
    el.classList.add("reach");
    setTimeout(function () { el.classList.add("out"); setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 480); }, RM ? 60 : 520);

    el.classList.add("slow");

  }
  // 문서에 적힌 스크립트만 센다(나중에 끼워 넣는 스크립트는 async 라 빠짐 — 연동 라이브러리·지도 등)
