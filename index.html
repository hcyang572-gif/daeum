<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>닿음</title>
<meta name="description" content="국민이 묻고, 공무원이 찾아간다 — 복지 창구 시제품">
<meta name="theme-color" content="#13655d">
<link rel="stylesheet" href="shared/tokens.css">
<style>
  body { min-height: 100vh; display: flex; flex-direction: column; }
  main { flex: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: 48px 16px 32px; }
  .name { font-size: 44px; font-weight: 800; color: var(--brand); letter-spacing: -0.03em; margin: 0; }
  .line { font-size: 22px; font-weight: 600; margin: 6px 0 36px; }
  .note { font-size: 14px; margin: -24px 0 28px; opacity: .8; }
  .doors { display: grid; gap: 16px; }
  .door { display: block; text-decoration: none; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px 22px; min-height: 120px; }
  .door:hover, .door:focus-visible { border-color: var(--brand); outline: none; }
  .door strong { display: block; font-size: 26px; margin-bottom: 6px; }
  .door span { color: var(--ink-soft); font-size: 18px; }
  .door.citizen strong { color: var(--brand); }
  .door.officer strong { color: var(--accent); }
  footer { max-width: 760px; width: 100%; margin: 0 auto; padding: 16px; font-size: var(--fs-small); color: var(--ink-soft); border-top: 1px solid var(--line); }
  @media (min-width: 640px) { .doors { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<main>
  <p class="name">닿음</p>
  <p class="line">국민이 묻고, 공무원이 찾아갑니다.</p>
  <p class="note">상주시 적용 예시 · 가구 정보는 모두 가상</p>
  <nav class="doors" aria-label="창구 선택">
    <a class="door citizen" href="citizen/index.html">
      <strong>내 복지 찾기</strong>
      <span>상황을 말하면 받을 수 있는 도움과 신청할 곳을 알려 드립니다. 가족을 대신해 물어도 됩니다.</span>
    </a>
    <a class="door officer" href="officer/index.html">
      <strong>공무원 창구</strong>
      <span>도움 요청과 발굴 명단을 보고, 오늘 찾아갈 집과 순서를 정합니다.</span>
    </a>
  </nav>
</main>
<footer>상주시 적용 예시 시제품 · 가구 정보는 모두 가상 · 공개 데이터와 합성(가상) 데이터만 씁니다 · 실제 개인정보 없음</footer>
</body>
</html>
