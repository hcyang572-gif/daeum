<desc id="a3-desc">한국사회보장정보원 발굴 명단과 복지서비스·자원정보, 공공데이터 연계처 712건 등은 받아 저장하고, 기상청 날씨·네이버 지도는 실시간으로 불러 닿음이 우선순위·방문 순서·연계 후보 735건·상담 기록을 정리한다. 결과는 같은 계정의 공무원 PC와 폰에 실시간으로 반영되고, 기기 안·닿음 전용 서버에 나눠 저장하며 성명·주민등록번호·전화는 읽지 않는다.</desc>
